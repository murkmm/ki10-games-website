<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1150">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quizlo</title>
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; min-height: 100dvh; }
  .wrap { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .me { display: flex; align-items: center; gap: 10px; padding: 4px 0 10px; color: var(--muted); }
  .me .name { color: #fff; font-weight: 600; }
  .me .score { margin-left: auto; }
  .qhead { color: var(--gold); font-weight: 600; margin-bottom: 6px; }
  .qtext { font-size: 1.45rem; font-weight: 600; margin: 0 0 14px; }
  .qimg { width: 100%; max-height: 34vh; object-fit: contain; border-radius: 14px; margin-bottom: 14px; background: rgba(0,0,0,0.25); }
  .listen { text-align: center; padding: 12px; border-radius: 14px; background: var(--card); margin-bottom: 14px; font-weight: 600; }
  .options { display: grid; gap: 12px; }
  .options.two { grid-template-columns: 1fr; }
  .opt { width: 100%; min-height: 84px; justify-content: flex-start; text-align: left; font-size: 1.35rem; padding: 12px 16px 16px; border: 4px solid transparent; border-radius: 20px; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.22), 0 8px 18px rgba(0,0,0,0.2); }
  .opt:active:not(:disabled) { box-shadow: inset 0 -2px 0 rgba(0,0,0,0.22); }
  .opt .letter { width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,0.22); display: inline-flex; align-items: center; justify-content: center; flex: none; color: #fff; }
  .opt.chosen { border-color: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,0.3), inset 0 -6px 0 rgba(0,0,0,0.22); animation: chosen 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes chosen { 0% { transform: scale(0.94); } 100% { transform: scale(1); } }
  .options.answered .opt:not(.chosen) { opacity: 0.4; filter: saturate(0.6); }
  .options.enter .opt { animation: rise 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }
  .options.enter .opt:nth-child(2) { animation-delay: 0.06s; } .options.enter .opt:nth-child(3) { animation-delay: 0.12s; }
  .options.enter .opt:nth-child(4) { animation-delay: 0.18s; } .options.enter .opt:nth-child(5) { animation-delay: 0.24s; } .options.enter .opt:nth-child(6) { animation-delay: 0.3s; }
  .tbar { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.12); overflow: hidden; margin-bottom: 12px; }
  .tbar div { height: 100%; width: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--good), var(--gold)); transition: width 0.25s linear; }
  .timer.hurry { color: var(--bad); animation: pop 0.5s ease-out; }
  .tbar.hurry div { background: var(--bad); }
  .bigdot { width: 96px; height: 96px; font-size: 3rem; margin: 0 auto; animation: bounce 1.6s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .burst { position: fixed; left: 50%; top: 40%; pointer-events: none; z-index: 30; font-size: 2rem; animation: burst 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
  @keyframes burst { from { transform: translate(-50%, -50%) scale(0.4); opacity: 1; } to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)) scale(1); opacity: 0; } }
  .opt.correct { border-color: #fff; }
  .numrow { display: flex; gap: 10px; }
  .numrow input { font-size: 2rem; text-align: center; font-weight: 600; }
  .status { text-align: center; margin-top: 14px; font-size: 1.1rem; color: var(--muted); min-height: 1.5em; }
  .timer { text-align: center; font-weight: 600; color: var(--gold); font-size: 1.2rem; }
  .verdict { text-align: center; padding: 26px 16px; border-radius: 22px; }
  .verdict.right { background: linear-gradient(160deg, rgba(46, 229, 157, 0.32), rgba(46, 229, 157, 0.12)); border: 3px solid var(--good); box-shadow: 0 0 40px rgba(46, 229, 157, 0.25); }
  .verdict.wrong { background: rgba(255, 92, 122, 0.14); border: 3px solid var(--bad); }
  .verdict .big { font-size: 2.6rem; font-weight: 600; }
  .verdict .icon { font-size: 4rem; line-height: 1; }
  .board { list-style: none; padding: 0; margin: 0; }
  .board li { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  .board li { animation: rise 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
  .board li.mine { background: rgba(255, 210, 63, 0.16); border-radius: 12px; }
  .board .rank { width: 48px; text-align: right; color: var(--gold); font-weight: 600; }
  .board .pts { margin-left: auto; font-weight: 600; }
  /* Choosing a picture */
  .faces { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
  .faces button { min-height: 52px; padding: 0; font-size: 1.9rem; background: rgba(255,255,255,0.06); border: 3px solid transparent; border-radius: 16px; }
  .faces button.on { border-color: var(--gold); background: rgba(255,210,63,0.18); transform: scale(1.06); }
  .mypic { display: flex; align-items: center; gap: 14px; justify-content: center; }
  .bigface { animation: bounce 1.6s ease-in-out infinite; margin: 0 auto; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  /* Reactions */
  .reacts { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 6px;
    padding: 10px 10px max(10px, env(safe-area-inset-bottom)); background: linear-gradient(to top, rgba(14,8,48,0.95) 60%, transparent); }
  .reacts button { min-height: 54px; min-width: 0; flex: 1; max-width: 64px; padding: 0; font-size: 1.8rem; background: rgba(255,255,255,0.08); border-radius: 18px; }
  .reacts button.sent { animation: chosen 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); }
  body.has-reacts .wrap { padding-bottom: 96px; }
  .floaty { position: fixed; z-index: 21; pointer-events: none; font-size: 2rem; animation: floaty 1s ease-out forwards; }
  @keyframes floaty { to { transform: translateY(-160px) scale(1.4); opacity: 0; } }
  /* Put in order */
  .order { display: grid; gap: 10px; }
  .order button { justify-content: flex-start; min-height: 64px; text-align: left; background: rgba(255,255,255,0.1); border: 3px solid transparent; }
  .order button .n { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.12); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .order button.picked { border-color: var(--gold); }
  .order button.picked .n { background: var(--gold); color: #2a1700; animation: pop 0.3s; }
  /* Tap the picture */
  .pinbox { position: relative; border-radius: 14px; overflow: hidden; margin-bottom: 14px; touch-action: manipulation; }
  .pinbox img { width: 100%; display: block; }
  .pinbox .pin { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.5); animation: pop 0.3s; }
  .pinbox .target { position: absolute; aspect-ratio: 1; border-radius: 50%; border: 4px dashed var(--good); background: rgba(46,229,157,0.2); }
</style>
</head>
<body>
<div id="banner" class="banner hidden">Reconnecting... hold on!</div>
<div class="wrap">
  <div id="me" class="me hidden">
    <span id="me-dot"></span>
    <span id="me-name" class="name"></span>
    <span id="me-score" class="score"></span>
  </div>
  <main id="screen">
    <div class="center"><div class="logo">Quizlo</div><div class="spinner"></div><p class="muted">Connecting to the TV...</p></div>
  </main>
</div>
<div id="reacts" class="reacts hidden"></div>
<input type="file" id="pick" accept="image/*" class="hidden">

<script type="module">
import { Connection, $, el, toast, store, keepAwake, LETTERS, ordinal, formatNumber, gameCode, servedByApp, face } from "./connection.js";
import { AVATARS, REACTIONS } from "./emoji.js";

const CODE = gameCode();
const TOKEN_KEY = "quizlo.player." + location.host + (CODE ? "." + CODE : "");
let state = null;
let pendingAnswer = null;   // what this phone last tapped, shown before the server confirms
let lastKey = "";
let draftNumber = "";
let lastSig = "";
let leaving = false;

let conn;
function startConnection() {
conn = new Connection({
  onOpen: () => conn.send({ t: "hello", role: "player", token: store(TOKEN_KEY) || "" }),
  onStatus: (ok, why) => {
    $("#banner").textContent = why === "notfound" ? `Can't find game ${CODE} - is the TV page still open? Trying again...` : "Reconnecting... hold on!";
    $("#banner").classList.toggle("hidden", ok);
    if (why === "notfound" && !state) askCode(`Can't find game ${CODE}. Check the code on the TV.`);
  },
  onMessage: (m) => {
    if (m.t === "need_name") { store(TOKEN_KEY, null); lastSig = ""; showJoin(m.quiz_title); }
    else if (m.t === "welcome") { store(TOKEN_KEY, m.token); keepAwake(); }
    else if (m.t === "state") { state = m; render(); }
    else if (m.t === "removed") { store(TOKEN_KEY, null); state = null; lastSig = ""; showJoin("", leaving ? "" : "You were removed from the game. You can join again."); leaving = false; }
    else if (m.t === "error") { toast(m.message); joinBusy(false); }
  },
});
}

// Playing on the website: the game code comes from the QR code link, or is typed in here.
if (CODE) startConnection();
else servedByApp().then((app) => (app ? startConnection() : askCode()));

function askCode(note) {
  const input = el("input", { maxlength: 4, autocapitalize: "characters", autocomplete: "off", autocorrect: "off", spellcheck: "false",
    placeholder: "ABCD", enterkeyhint: "go", style: "text-align:center;font-size:2.4rem;letter-spacing:0.4em;text-transform:uppercase" });
  const go = () => {
    const code = input.value.trim().toUpperCase();
    if (!/^[A-Z]{4}$/.test(code)) { toast("The game code is 4 letters - it's on the TV"); input.focus(); return; }
    location.hash = code;
    location.reload();
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  screen(el("div", { class: "stack center" },
    el("div", { class: "logo" }, "Quizlo"),
    note ? el("p", { class: "gold" }, note) : null,
    el("label", { class: "field" }, "Type the game code shown on the TV"),
    input,
    el("button", { class: "primary big", onclick: go }, "Join the game")));
}

function screen(...children) {
  const s = $("#screen");
  s.replaceChildren(...children);
}

function joinBusy(busy) {
  const b = $("#join-btn");
  if (b) { b.disabled = busy; b.textContent = busy ? "Joining..." : "Join the quiz"; }
}

function showJoin(title, note) {
  $("#me").classList.add("hidden");
  const input = el("input", { id: "name", maxlength: 16, autocomplete: "given-name", autocapitalize: "words",
    placeholder: "Your name", enterkeyhint: "go", value: store("quizlo.name") || "" });
  const join = () => {
    const name = input.value.trim();
    if (!name) { toast("Please type your name first"); input.focus(); return; }
    store("quizlo.name", name);
    joinBusy(true);
    if (!conn.send({ t: "join", name, ...myPicture() })) { toast("Not connected yet - try again in a moment"); joinBusy(false); }
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
  screen(el("div", { class: "stack center" },
    el("div", { class: "logo" }, "Quizlo"),
    title ? el("h2", {}, title) : null,
    note ? el("p", { class: "gold" }, note) : null,
    el("label", { class: "field", for: "name" }, "What's your name?"),
    input,
    el("label", { class: "field" }, "Pick your picture"),
    picturePicker(),
    el("button", { id: "join-btn", class: "primary big", onclick: join }, "Join the quiz"),
  ));
}

// --- Your picture: an emoji or a selfie (remembered on this phone) --------------------------------
if (!AVATARS.includes(store("quizlo.emoji"))) store("quizlo.emoji", AVATARS[Math.floor(Math.random() * AVATARS.length)]);
const usingPhoto = () => store("quizlo.pic") === "photo" && !!store("quizlo.photo");
/** What to send the TV: { emoji } or { photo } (base64 JPEG). */
function myPicture() {
  return usingPhoto() ? { photo: store("quizlo.photo") } : { emoji: store("quizlo.emoji") };
}

function picturePicker(onChange = () => {}) {
  const box = el("div", { class: "stack" });
  const draw = () => {
    const mine = { color: state?.me?.color || "8b5cf6", name: store("quizlo.name") || "?", ...(usingPhoto() ? { photo: "self" } : { emoji: store("quizlo.emoji") }) };
    box.replaceChildren(
      el("div", { class: "mypic" }, face(mine, 72, { cls: "pop" }),
        el("div", { class: "stack", style: "display:flex;flex-direction:column;gap:8px" },
          photoButton("📷 Take a selfie", true), photoButton("🖼 From my photos", false))),
      el("div", { class: "faces" }, AVATARS.map((e) => el("button", {
        class: !usingPhoto() && store("quizlo.emoji") === e ? "on" : "", type: "button",
        onclick: () => { store("quizlo.emoji", e); store("quizlo.pic", "emoji"); buzz(15); draw(); onChange(); },
      }, e))));
  };
  const photoButton = (label, camera) => el("button", { class: "ghost small", type: "button", onclick: async () => {
    try {
      const photo = await takeSelfie(camera);
      if (!photo) return;
      store("quizlo.photo", photo); store("quizlo.pic", "photo");
      draw(); onChange();
    } catch (_) { toast("Couldn't use that picture - try another"); }
  } }, label);
  draw();
  return box;
}

/** Opens the front camera (or the photo gallery) and makes a small square picture. */
function takeSelfie(camera = true) {
  return new Promise((resolve, reject) => {
    const input = $("#pick");
    input.value = "";
    if (camera) input.setAttribute("capture", "user");
    else input.removeAttribute("capture");
    input.onchange = () => {
      const file = input.files[0];
      if (!file) return resolve(null);
      const img = new Image();
      img.onload = () => {
        const size = 200, c = el("canvas", { width: size, height: size });
        const side = Math.min(img.naturalWidth, img.naturalHeight);
        c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL("image/jpeg", 0.82).split(",")[1]);
      };
      img.onerror = () => reject(new Error("bad picture"));
      img.src = URL.createObjectURL(file);
    };
    input.click();
  });
}

function changePicture() {
  screen(el("div", { class: "stack center" },
    el("h2", {}, "Your picture"),
    picturePicker(() => conn.send({ t: "avatar", ...myPicture() })),
    el("button", { class: "primary big", onclick: () => { lastSig = ""; render(); } }, "Done")));
}

// --- Reactions: tap an emoji to send it floating up the TV ----------------------------------------
let lastReact = 0;
$("#reacts").append(...REACTIONS.map((e) => {
  const b = el("button", { type: "button" }, e);
  b.onclick = () => {
    const now = Date.now();
    if (now - lastReact < 650) return;
    lastReact = now;
    conn.send({ t: "react", e });
    buzz(12);
    b.classList.remove("sent"); void b.offsetWidth; b.classList.add("sent");
    const r = b.getBoundingClientRect();
    const f = el("div", { class: "floaty", style: `left:${r.left + r.width / 2 - 16}px;top:${r.top - 10}px` }, e);
    document.body.append(f);
    setTimeout(() => f.remove(), 1000);
  };
  return b;
}));
function showReactions(on) {
  $("#reacts").classList.toggle("hidden", !on);
  document.body.classList.toggle("has-reacts", on);
}

function render() {
  const s = state;
  $("#me").classList.remove("hidden");
  $("#me-dot").replaceChildren(face(s.me, 34));
  $("#me-name").textContent = s.me.name;
  $("#me-score").textContent = s.me.score === 1 ? "1 point" : `${s.me.score} points`;

  const q = s.question || {};
  if (q.key !== lastKey) { lastKey = q.key; pendingAnswer = null; draftNumber = ""; orderPick = null; if (q.key && navigator.vibrate) navigator.vibrate(80); }
  showReactions(["lobby", "round_intro", "reveal", "scores", "final"].includes(s.phase));

  // Other players answering re-sends the state; don't rebuild the screen (and close the keyboard) for that.
  const sig = JSON.stringify([s.phase, q.key, q.open, pendingAnswer ?? s.my_answer, s.round, s.me.rank, s.me.score, s.quiz_title, s.leaderboard, s.me.emoji, s.me.photo, q.image]);
  if (sig === lastSig) return;
  lastSig = sig;

  switch (s.phase) {
    case "idle":
    case "lobby":
      return waiting("You're in!", s.quiz_title ? `Get ready for "${s.quiz_title}". Look at the TV - the quiz will start soon.` : "Waiting for the quiz master to pick a quiz...", true);
    case "round_intro":
      return waiting(`Round ${s.round.number}`, s.round.title, false, "Get ready - look at the TV!");
    case "question":
      return renderQuestion(s, q);
    case "reveal":
      return renderReveal(s, q);
    case "scores":
    case "final":
      return renderScores(s);
  }
}

function waiting(title, text, canRename, extra) {
  const children = [
    canRename && state ? face(state.me, 110, { cls: "bigface" }) : null,
    el("h1", { class: "pop" }, title),
    el("p", { style: "font-size:1.3rem" }, text),
  ];
  if (extra) children.push(el("p", { class: "gold" }, extra));
  if (canRename) children.push(el("p", { class: "small muted", style: "margin-top:40px" },
    el("a", { href: "#", onclick: (e) => { e.preventDefault(); changePicture(); } }, "Change my picture"), "  ·  Not you? ",
    el("a", { href: "#", onclick: (e) => { e.preventDefault(); leaving = true; lastSig = ""; conn.send({ t: "leave" }); store(TOKEN_KEY, null); showJoin(state?.quiz_title); } }, "Change name")));
  screen(el("div", { class: "center stack" }, ...children));
}

function header(q) {
  return el("div", { class: "qhead" }, `Question ${q.number} of ${q.total}` + (q.points > 1 ? `  ·  ${q.points} points` : ""));
}

function media(q) {
  if (q.type === "pin") return null; // the picture is where you answer
  if (q.reveal && !q.image) return el("div", { class: "listen" }, "👀 Watch the picture appear on the TV!");
  if (q.image) return el("img", { class: "qimg", src: q.image, alt: "" });
  // The quiz master can switch on music & video on phones (for family joining from elsewhere).
  if (q.audio) return el("div", { class: "listen" }, el("div", {}, "🎵 Listen!"), el("audio", { src: q.audio, controls: true, autoplay: true, style: "width:100%;margin-top:8px" }));
  if (q.video) return el("video", { class: "qimg", src: q.video, controls: true, autoplay: true, playsinline: true });
  if (q.media === "audio") return el("div", { class: "listen" }, "🎵 Listen to the TV!");
  if (q.media === "video") return el("div", { class: "listen" }, "📺 Watch the TV!");
  return null;
}

let timerHandle;
let enteredKey = "";
let orderPick = null; // "put in order": the items tapped so far (positions on screen); null = as sent
const buzz = (pattern) => { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) {} };
/** A little burst of emoji confetti for a right answer. */
function celebrate() {
  const bits = ["🎉", "⭐", "✨", "🎊", "💥", "🌟"];
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2, d = 120 + Math.random() * 120;
    const b = el("div", { class: "burst", style: `--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px;--r:${(Math.random() - 0.5) * 540}deg;animation-delay:${Math.random() * 0.12}s` }, bits[i % bits.length]);
    document.body.append(b);
    setTimeout(() => b.remove(), 1500);
  }
}
function renderQuestion(s, q) {
  const mine = pendingAnswer ?? s.my_answer;
  const answered = mine !== undefined && mine !== null;
  const parts = [header(q), q.text ? el("div", { class: "qtext" }, q.text) : null, media(q)];

  if (q.type === "choice") {
    const opts = el("div", { class: "options" + (answered ? " answered" : "") + (enteredKey !== q.key ? " enter" : "") });
    enteredKey = q.key;
    q.options.forEach((text, i) => {
      opts.append(el("button", {
        class: `opt opt-${i}` + (mine === i ? " chosen" : ""),
        disabled: !q.open,
        onclick: () => { buzz(25); pendingAnswer = i; conn.send({ t: "answer", q: q.key, v: i }); render(); },
      }, el("span", { class: "letter" }, LETTERS[i]), el("span", {}, text)));
    });
    parts.push(opts);
  } else if (q.type === "text") {
    const input = el("input", { type: "text", autocomplete: "off", autocapitalize: "sentences", maxlength: 60, placeholder: "Type your answer",
      value: draftNumber || (answered ? String(mine) : ""), disabled: !q.open, enterkeyhint: "send" });
    input.addEventListener("input", () => { draftNumber = input.value; });
    const send = () => {
      const v = input.value.trim();
      if (!v) { toast("Please type an answer"); input.focus(); return; }
      buzz(25);
      pendingAnswer = v; draftNumber = "";
      conn.send({ t: "answer", q: q.key, v }); input.blur(); render();
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    parts.push(input, el("button", { class: "go big", style: "margin-top:12px", disabled: !q.open, onclick: send }, answered ? "Change my answer" : "Send my answer"));
  } else if (q.type === "order") {
    const pick = orderPick ?? (Array.isArray(mine) ? mine : []);
    parts.push(el("p", { class: "muted", style: "margin-top:0" }, pick.length === q.options.length ? "Got your order ✓" : `Tap them in order: what comes first?`));
    parts.push(el("div", { class: "order" }, q.options.map((text, i) => {
      const n = pick.indexOf(i);
      return el("button", { class: n >= 0 ? "picked" : "", disabled: !q.open, onclick: () => {
        buzz(15);
        orderPick = pick.slice();
        if (n >= 0) orderPick = orderPick.slice(0, n); // tapping a numbered one undoes from there
        else orderPick = [...orderPick, i];
        if (orderPick.length === q.options.length) { pendingAnswer = orderPick.slice(); conn.send({ t: "answer", q: q.key, v: pendingAnswer }); }
        lastSig = ""; render();
      } }, el("span", { class: "n" }, n >= 0 ? String(n + 1) : ""), el("span", {}, text));
    })));
    if (pick.length) parts.push(el("button", { class: "ghost small", style: "margin-top:10px", disabled: !q.open, onclick: () => { orderPick = []; lastSig = ""; render(); } }, "↺ Start again"));
  } else if (q.type === "pin") {
    const box = el("div", { class: "pinbox" }, el("img", { src: q.image, alt: "" }));
    if (answered && mine) box.append(el("span", { class: "pin", style: `left:${mine.x * 100}%;top:${mine.y * 100}%;background:#${s.me.color}` }));
    box.onclick = (e) => {
      if (!q.open) return;
      const r = box.getBoundingClientRect();
      const v = { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
      buzz(25);
      pendingAnswer = v;
      conn.send({ t: "answer", q: q.key, v }); render();
    };
    parts.push(el("p", { class: "muted", style: "margin-top:0" }, answered ? "Got it ✓ Tap again to move your pin." : "Tap the right spot on the picture!"), box);
  } else {
    const input = el("input", { type: "text", inputmode: "decimal", autocomplete: "off", placeholder: "Your guess",
      value: draftNumber || (answered ? formatNumber(Number(mine)) : ""), disabled: !q.open, enterkeyhint: "send" });
    input.addEventListener("input", () => { draftNumber = input.value; });
    const send = () => {
      const v = input.value.trim().replace(",", ".");
      if (v === "" || isNaN(Number(v))) { toast("Please type a number"); input.focus(); return; }
      pendingAnswer = Number(v); draftNumber = "";
      conn.send({ t: "answer", q: q.key, v: Number(v) }); input.blur(); render();
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    parts.push(el("div", { class: "numrow" }, input, q.unit ? el("span", { class: "bold", style: "align-self:center" }, q.unit) : null));
    parts.push(el("button", { class: "go big", style: "margin-top:12px", disabled: !q.open, onclick: send }, answered ? "Change my guess" : "Send my guess"));
  }

  let status = "";
  if (!q.open) status = "Time's up! Look at the TV.";
  else if (answered && q.type === "closest") status = `Your guess: ${formatNumber(Number(mine))}${q.unit ? " " + q.unit : ""} ✓ You can change it until time's up.`;
  else if (answered && q.type !== "pin") status = "Got it! ✓ You can change your answer until time's up.";
  parts.push(el("div", { class: "status" }, status));

  const timer = el("div", { class: "timer" });
  const tfill = el("div");
  const tbar = el("div", { class: "tbar" }, tfill);
  if (q.time > 0 && q.open) parts.unshift(tbar, timer);
  screen(el("div", {}, ...parts));

  clearInterval(timerHandle);
  if (q.time > 0 && q.open) {
    const ends = Date.now() + q.time_left_ms;
    let shown = -1;
    const tick = () => {
      const ms = Math.max(0, ends - Date.now());
      const left = Math.ceil(ms / 1000);
      tfill.style.width = `${Math.min(100, (ms / (q.time * 1000)) * 100)}%`;
      if (left === shown) return;
      shown = left;
      timer.textContent = left > 0 ? `⏱ ${left} second${left === 1 ? "" : "s"} left` : "⏱ Time's up!";
      const hurry = left > 0 && left <= 5;
      tbar.classList.toggle("hurry", hurry);
      timer.classList.remove("hurry");
      if (hurry) { void timer.offsetWidth; timer.classList.add("hurry"); }
    };
    tick(); timerHandle = setInterval(tick, 250);
  }
}

function renderReveal(s, q) {
  clearInterval(timerHandle);
  const answered = s.my_answer !== undefined;
  const right = s.gained > 0;
  let title, icon;
  if (right) { title = q.type === "closest" ? "Closest!" : q.type === "pin" ? "Spot on!" : "Correct!"; icon = "🎉"; }
  else if (!answered) { title = "No answer"; icon = "⏰"; }
  else { title = q.type === "closest" ? "Not the closest" : "Not this time"; icon = "🙈"; }
  let yours = null;
  if (answered) {
    const a = s.my_answer;
    if (q.type === "choice") yours = q.options[a];
    else if (q.type === "text") yours = a;
    else if (q.type === "order") yours = a.map((i) => q.options[i]).join(" → ");
    else if (q.type === "closest") yours = formatNumber(Number(a)) + (q.unit ? " " + q.unit : "");
  }
  let answerBox = el("div", { style: "font-size:1.6rem;font-weight:600" }, q.answer_text);
  if (q.type === "order") answerBox = el("ol", { style: "text-align:left;font-size:1.3rem;font-weight:600;margin:6px 0" }, q.order.map((t) => el("li", {}, t)));
  if (q.type === "pin" && q.image) {
    answerBox = el("div", { class: "pinbox", style: "margin:8px 0 0" }, el("img", { src: q.image, alt: "" }),
      el("span", { class: "target", style: `left:${q.target.x * 100}%;top:${q.target.y * 100}%;width:${q.radius * 200}%;margin:-${q.radius * 100}% 0 0 -${q.radius * 100}%` }));
    if (answered) answerBox.append(el("span", { class: "pin", style: `left:${s.my_answer.x * 100}%;top:${s.my_answer.y * 100}%;background:#${s.me.color}` }));
  }
  if (right) { celebrate(); buzz([30, 60, 30, 60, 60]); } else buzz(120);
  screen(el("div", { class: "stack" },
    header(q),
    el("div", { class: "verdict " + (right ? "right pop" : "wrong shake") },
      el("div", { class: "icon" }, icon),
      el("div", { class: "big" }, title),
      right ? el("div", { class: "gold", style: "font-size:1.6rem;font-weight:600" }, `+${s.gained} point${s.gained === 1 ? "" : "s"}`) : null),
    el("div", { class: "card center" },
      el("div", { class: "muted" }, q.type === "pin" ? "The right spot" : q.type === "order" ? "The right order" : "The answer was"),
      answerBox,
      yours !== null && !right ? el("div", { class: "muted small", style: "margin-top:6px" }, `You said: ${yours}`) : null),
    el("p", { class: "center muted" }, `You're ${ordinal(s.me.rank)} with ${s.me.score} point${s.me.score === 1 ? "" : "s"}`),
  ));
}

function renderScores(s) {
  clearInterval(timerHandle);
  const final = s.phase === "final";
  const board = s.leaderboard || [];
  const winners = board.filter((e) => e.rank === 1).map((e) => e.name);
  const iWon = s.me.rank === 1;
  if (final && iWon) { celebrate(); buzz([40, 60, 40, 60, 120]); }
  const list = el("ol", { class: "board" }, board.map((e, i) => el("li", { class: e.name === s.me.name ? "mine" : "", style: `animation-delay:${i * 0.07}s` },
    el("span", { class: "rank" }, ordinal(e.rank)),
    face(e.name === s.me.name ? s.me : e, 36),
    el("span", {}, e.name),
    el("span", { class: "pts" }, e.score))));
  screen(el("div", { class: "stack" },
    final
      ? el("div", { class: "center pop" }, el("div", { style: "font-size:4rem" }, iWon ? "🏆" : s.me.rank <= 3 ? ["", "", "🥈", "🥉"][s.me.rank] : "🎉"),
          el("h1", {}, iWon ? "You won!" : `${winners.join(" & ")} won!`),
          el("p", {}, `You came ${ordinal(s.me.rank)} with ${s.me.score} point${s.me.score === 1 ? "" : "s"}. Thanks for playing!`))
      : el("div", { class: "center" }, el("h1", {}, `After round ${s.round.number}`),
          el("p", {}, `You're ${ordinal(s.me.rank)} with ${s.me.score} point${s.me.score === 1 ? "" : "s"}`)),
    el("div", { class: "card" }, list),
  ));
}
</script>
</body>
</html>
