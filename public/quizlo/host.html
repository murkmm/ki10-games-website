<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1150">
<title>Quizlo - Quiz master</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { padding-bottom: 130px; }
  .top { display: flex; align-items: center; gap: 10px; padding-right: 60px; }
  .top .logo { font-size: 1.6rem; }
  .phase { margin-left: auto; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg-deep) 70%, transparent);
  }
  .dock .inner { max-width: 640px; margin: 0 auto; }
  .answer { background: rgba(46, 229, 157, 0.16); border: 2px solid var(--good); border-radius: 14px; padding: 10px 14px; margin-top: 10px; }
  .answer b { color: var(--good); }
  .qtext { font-size: 1.25rem; font-weight: 600; }
  .players { list-style: none; padding: 0; margin: 0; }
  .players li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .players li:last-child { border-bottom: 0; }
  .players .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players .sc { font-weight: 600; min-width: 2.2em; text-align: center; }
  .players .offline { opacity: 0.5; }
  .tick { color: var(--good); font-weight: 600; }
  .wait { color: var(--muted); }
  .players button { min-height: 40px; min-width: 44px; padding: 4px 10px; }
  .quizzes .q { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .quizzes .q:last-child { border-bottom: 0; }
  .quizzes .q.current { color: var(--gold); }
  details summary { cursor: pointer; font-weight: 600; padding: 6px 0; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; color: var(--gold); }
  details[open] summary::before { content: "▾ "; }
  #soundbtn { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 45; width: 52px; height: 52px; min-height: 0; padding: 0; border-radius: 50%; font-size: 1.5rem;
    background: rgba(20, 12, 60, 0.85); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #sound { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 60px); right: 12px; left: 12px; max-width: 420px; margin-left: auto; z-index: 45;
    background: rgba(20, 12, 60, 0.97); animation: rise 0.25s ease-out both; }
  #sound .vol { display: flex; align-items: center; gap: 12px; }
  #sound .vol input { flex: 1; }
  #sound .vol .pct { width: 3.2em; text-align: right; font-weight: 600; }
  #sound .vol button { min-width: 52px; padding: 0; }
</style>
</head>
<body>
<div id="banner" class="banner hidden">Reconnecting to the TV...</div>
<div class="wrap" id="app">
  <div class="center"><div class="logo">Quizlo</div><div class="spinner"></div></div>
</div>
<button id="soundbtn" class="hidden" title="Volume">🔊</button>
<div id="sound" class="card stack hidden">
  <div class="bold">🔊 Sound on the TV</div>
  <div><div class="small muted">Music & videos</div>
    <div class="vol"><button class="ghost small" data-mute="media">🔇</button><input type="range" min="0" max="100" step="5" data-vol="media"><span class="pct" data-pct="media"></span></div></div>
  <div><div class="small muted">Sound effects</div>
    <div class="vol"><button class="ghost small" data-mute="sfx">🔇</button><input type="range" min="0" max="100" step="5" data-vol="sfx"><span class="pct" data-pct="sfx"></span></div></div>
  <p class="small muted" style="margin:0">On an iPad or iPhone showing the TV page, use its own volume buttons for music & videos.</p>
</div>
<div class="dock hidden" id="dock"><div class="inner"><button id="advance" class="primary big"></button></div></div>
<input type="file" id="file" accept=".quizlo,.quizzy,application/zip,application/octet-stream" class="hidden">

<script type="module">
import { Connection, $, el, toast, store, keepAwake, ordinal, formatNumber, LETTERS, gameCode, linkHostKey } from "./connection.js";

// With the app the quiz master code comes as ?k=...; on the website as host.html#CODE-key.
const CODE = gameCode();
const KEY_STORE = "quizlo.hostkey." + location.host + (CODE ? "." + CODE : "");
const params = new URLSearchParams(location.search);
if (params.get("k")) { store(KEY_STORE, params.get("k")); history.replaceState(null, "", location.pathname); }
if (linkHostKey()) store(KEY_STORE, linkHostKey());
let key = store(KEY_STORE) || "";
let uploadWaiter = null; // resolves when the TV page confirms a quiz sent from this phone
let state = null;
const opened = {}; // remembers which collapsible sections the host has opened/closed

function section(id, defaultOpen, summary, ...children) {
  const d = el("details", {}, summary, ...children);
  d.open = id in opened ? opened[id] : defaultOpen;
  d.addEventListener("toggle", () => { opened[id] = d.open; });
  return d;
}

const conn = new Connection({
  onOpen: () => { if (key) conn.send({ t: "hello", role: "host", key }); else askKey(); },
  onStatus: (ok) => $("#banner").classList.toggle("hidden", ok),
  onMessage: (m) => {
    if (m.t === "state") { state = m; render(); }
    else if (m.t === "bad_key") { store(KEY_STORE, null); key = ""; askKey("That code didn't work."); }
    else if (m.t === "error") toast(m.message);
    else if (m.t === "uploaded" && uploadWaiter) { uploadWaiter(m); uploadWaiter = null; }
  },
});

/** Sends quiz file bytes to the TV: over the connection on the website, or by upload to the app. */
async function sendQuizToTv(blob) {
  if (CODE) {
    const data = await blob.arrayBuffer();
    const reply = new Promise((resolve) => { uploadWaiter = resolve; });
    if (!conn.send({ t: "upload", data })) throw new Error("Not connected to the TV.");
    return reply;
  }
  const r = await fetch(`/api/upload?k=${encodeURIComponent(key)}`, { method: "POST", body: blob, headers: { "Content-Type": "application/zip" } });
  return r.json();
}

$("#advance").onclick = () => { conn.send({ t: "advance" }); keepAwake(); };

// --- Volume (kept outside the main page so sliding isn't interrupted when the page redraws)
const volume = { media: 100, sfx: 70 };
const unmuted = { media: 100, sfx: 70 };
let volTimer = null, volDragging = 0;
$("#soundbtn").onclick = () => $("#sound").classList.toggle("hidden");
document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#sound, #soundbtn")) $("#sound").classList.add("hidden"); });
function sendVolume() {
  clearTimeout(volTimer);
  volTimer = setTimeout(() => { volTimer = null; conn.send({ t: "volume", media: volume.media, sfx: volume.sfx }); }, 120);
}
function showVolume() {
  for (const k of ["media", "sfx"]) {
    const input = document.querySelector(`[data-vol=${k}]`);
    if (!volDragging) input.value = volume[k];
    document.querySelector(`[data-pct=${k}]`).textContent = `${volume[k]}%`;
    document.querySelector(`[data-mute=${k}]`).textContent = volume[k] === 0 ? "🔇" : volume[k] < 50 ? "🔉" : "🔊";
  }
  $("#soundbtn").textContent = volume.media === 0 && volume.sfx === 0 ? "🔇" : "🔊";
}
for (const k of ["media", "sfx"]) {
  const input = document.querySelector(`[data-vol=${k}]`);
  input.addEventListener("pointerdown", () => { volDragging++; });
  input.addEventListener("change", () => { volDragging = 0; });
  input.addEventListener("pointerup", () => { volDragging = 0; });
  input.addEventListener("pointercancel", () => { volDragging = 0; });
  input.addEventListener("input", () => { volume[k] = Number(input.value); if (volume[k] > 0) unmuted[k] = volume[k]; showVolume(); sendVolume(); });
  document.querySelector(`[data-mute=${k}]`).onclick = () => {
    volume[k] = volume[k] === 0 ? (unmuted[k] || 70) : 0;
    showVolume(); sendVolume();
  };
}

function askKey(note) {
  $("#dock").classList.add("hidden");
  const input = el("input", { placeholder: "Quiz master code", autocapitalize: "off", autocomplete: "off" });
  $("#app").replaceChildren(el("div", { class: "stack center" },
    el("div", { class: "logo" }, "Quizlo"),
    el("h2", {}, "Quiz master"),
    note ? el("p", { class: "gold" }, note) : null,
    el("p", {}, CODE ? "Scan the 'Quiz master' code on the TV with your phone camera." : "Scan the 'Quiz master' code on the TV with your phone camera, or type the code from the end of the address shown there (after k=)."),
    input,
    el("button", { class: "primary big", onclick: () => { key = input.value.trim(); store(KEY_STORE, key); conn.send({ t: "hello", role: "host", key }); } }, "Continue"),
  ));
}

const PHASE_TEXT = {
  idle: "Choose a quiz", lobby: "Waiting to start", round_intro: "Round intro",
  question: "Question on screen", reveal: "Answer revealed", scores: "Scores", final: "Final scores",
};

function render() {
  const s = state;
  $("#soundbtn").classList.remove("hidden");
  if (s.volume && !volDragging && !volTimer) {
    Object.assign(volume, s.volume);
    for (const k of ["media", "sfx"]) if (volume[k] > 0) unmuted[k] = volume[k];
    showVolume();
  }
  const app = $("#app");
  const parts = [];
  parts.push(el("div", { class: "top" },
    el("div", { class: "logo" }, "Quizlo"),
    el("span", { class: "pill phase" }, PHASE_TEXT[s.phase] || s.phase)));

  if (s.quiz.title) parts.push(el("h2", {}, s.quiz.title));

  if (s.phase === "idle") {
    parts.push(el("p", {}, "Pick a quiz to play below, or upload one you've written."));
  }
  if (s.phase === "lobby") {
    parts.push(el("div", { class: "card" },
      el("p", { style: "margin-top:0" }, `${s.players.length} ${s.players.length === 1 ? "person has" : "people have"} joined. Everyone scans the code on the TV, or goes to:`),
      el("p", { class: "gold bold", style: "font-size:1.3rem;word-break:break-all" }, s.join_url.replace("http://", "").replace(/\/$/, "") + (s.online ? `  and enters code ${s.code}` : "")),
      el("p", { class: "small muted" }, "When everyone's in, press the big button.")));
  }
  if (s.phase === "round_intro") {
    parts.push(el("div", { class: "card center" }, el("div", { class: "muted" }, `Round ${s.round.number} of ${s.round.of}`), el("h2", {}, s.round.title)));
  }
  if (s.phase === "question" || s.phase === "reveal") parts.push(questionCard(s));
  if (s.phase === "scores" || s.phase === "final") {
    parts.push(el("div", { class: "card center" }, el("h2", {}, s.phase === "final" ? "🏆 Final scores" : `Scores after round ${s.round.number}`),
      el("p", { class: "muted small" }, "These are on the TV now.")));
  }

  parts.push(playersCard(s));
  parts.push(quizzesCard(s));
  parts.push(moreCard(s));
  app.replaceChildren(...parts);

  const label = s.advance_label;
  $("#dock").classList.toggle("hidden", !label);
  $("#advance").textContent = label ? label + "  ▶" : "";
  $("#advance").disabled = s.phase === "lobby" && s.players.length === 0;
  if (s.phase === "lobby" && s.players.length === 0) $("#advance").textContent = "Waiting for players...";
}

function questionCard(s) {
  const q = s.question;
  const card = el("div", { class: "card" });
  card.append(el("div", { class: "muted small" }, `Round ${s.round.number}: ${s.round.title}  ·  Question ${q.number} of ${q.total}`));
  if (q.text) card.append(el("div", { class: "qtext" }, q.text));
  if (q.media) card.append(el("div", { class: "small muted" }, { image: "🖼 Picture question", audio: "🎵 Music question", video: "📺 Video question" }[q.media]));
  if (q.type === "choice") {
    card.append(el("div", { class: "answer" }, "Answer: ", el("b", {}, `${LETTERS[q.answer]}. ${q.answer_text}`)));
  } else {
    card.append(el("div", { class: "answer" }, "Answer: ", el("b", {}, q.answer_text), el("span", { class: "small muted" }, "  (closest guess wins)")));
  }
  const btns = el("div", { class: "btnrow" });
  if (s.phase === "question") {
    card.append(el("p", { class: "bold" }, `${s.answered} of ${s.players.length} answered` + (q.open ? "" : " · answers locked")));
    if (q.open) btns.append(el("button", { class: "ghost", onclick: () => conn.send({ t: "lock" }) }, "⏹ Stop answers now"));
    else btns.append(el("button", { class: "go", onclick: () => conn.send({ t: "unlock" }) }, q.time > 0 ? "🔓 Open answers again (+15 seconds)" : "🔓 Open answers again"));
  }
  if (q.media === "audio" || q.media === "video") btns.append(el("button", { class: "ghost", onclick: () => conn.send({ t: "replay" }) }, "🔁 Play clip again"));
  if (btns.children.length) card.append(btns);
  return card;
}

function playersCard(s) {
  const showAnswers = s.phase === "question" || s.phase === "reveal";
  const q = s.question;
  const list = el("ul", { class: "players" });
  if (s.players.length === 0) list.append(el("li", { class: "muted" }, "Nobody has joined yet."));
  for (const p of s.players) {
    let status = null;
    if (showAnswers) {
      if (p.answered) {
        let a = q.type === "choice" ? LETTERS[p.answer] : formatNumber(p.answer);
        status = s.phase === "reveal" ? el("span", { class: p.gained ? "tick" : "wait" }, (p.gained ? "✓ " : "✗ ") + a) : el("span", { class: "tick" }, "✓");
      } else status = el("span", { class: "wait" }, s.phase === "reveal" ? "-" : "thinking...");
    }
    list.append(el("li", { class: p.online ? "" : "offline" },
      el("span", { class: "dot", style: `background:#${p.color};width:36px;height:36px` }, p.name.slice(0, 1).toUpperCase()),
      el("span", { class: "nm" }, p.name + (p.online ? "" : " (offline)")),
      status,
      el("button", { class: "ghost small", title: "Take a point away", onclick: () => conn.send({ t: "adjust", pid: p.id, d: -1 }) }, "−"),
      el("span", { class: "sc" }, p.score),
      el("button", { class: "ghost small", title: "Give a point", onclick: () => conn.send({ t: "adjust", pid: p.id, d: 1 }) }, "+"),
    ));
  }
  const removeList = el("div", { class: "btnrow" }, s.players.map((p) =>
    el("button", { class: "danger small", onclick: () => { if (confirm(`Remove ${p.name} from the game?`)) conn.send({ t: "kick", pid: p.id }); } }, `Remove ${p.name}`)));
  return el("div", { class: "card" },
    el("h3", { style: "margin-top:0" }, `Players & scores (${s.players.length})`),
    list,
    s.players.length ? section("remove", false, el("summary", { class: "small muted" }, "Remove a player"), removeList) : null);
}

function quizzesCard(s) {
  const busy = ["round_intro", "question", "reveal", "scores"].includes(s.phase);
  const box = el("div", { class: "quizzes" });
  for (const q of s.quizzes) {
    const current = q.id === s.quiz.id;
    box.append(el("div", { class: "q" + (current ? " current" : "") },
      el("div", { class: "grow" }, el("div", { class: "bold" }, q.title),
        el("div", { class: "small muted" }, `${q.questions} questions in ${q.rounds} round${q.rounds === 1 ? "" : "s"}` + (q.author ? ` · by ${q.author}` : ""))),
      current ? el("span", { class: "pill" }, "Chosen")
        : el("button", { class: "small", onclick: () => {
            if (busy && !confirm("A quiz is in progress. Switch quiz? Scores will be reset.")) return;
            conn.send({ t: "load", id: q.id });
          } }, "Play this"),
    ));
  }
  const upload = el("button", { class: "ghost", onclick: () => $("#file").click() }, "⬆ Upload a quiz file");
  const editor = el("a", { class: "button ghost", href: s.online ? "editor.html" : `/editor?k=${encodeURIComponent(key)}`, target: s.online ? "_blank" : "" }, "✏️ Write or edit quizzes");
  const open = s.phase === "idle" || s.phase === "lobby" || s.phase === "final";
  const details = section("quizzes-" + open, open,
    el("summary", {}, "Quizzes on this TV"),
    box, el("div", { class: "btnrow" }, upload, editor));
  return el("div", { class: "card" }, details, s.online ? myQuizzes() : null);
}

/** On the website: quizzes written in the Quiz Writer on this phone, ready to send to the TV. */
let myQuizList = null;
function myQuizzes() {
  const box = el("div", { class: "quizzes" }, el("p", { class: "small muted" }, "Looking..."));
  const fill = (list) => {
    box.replaceChildren();
    if (!list.length) box.append(el("p", { class: "small muted" }, "None yet - quizzes you write in the Quiz Writer on this phone appear here."));
    for (const q of list) {
      const send = el("button", { class: "small" }, "📺 Send to TV");
      send.onclick = async () => {
        send.disabled = true;
        send.textContent = "Sending...";
        toast("Sending to the TV - quizzes with videos can take a minute...");
        try {
          const { buildQuizFile } = await import("./library.js");
          const { blob, empty } = await buildQuizFile(q);
          if (empty) throw new Error("That quiz doesn't have any finished questions yet.");
          const res = await sendQuizToTv(blob);
          toast(res.ok ? `"${res.title}" is on the TV` : res.error);
        } catch (e) { toast(e.message || "Couldn't send that quiz."); }
        send.disabled = false;
        send.textContent = "📺 Send to TV";
      };
      const n = q.rounds.reduce((k, r) => k + r.questions.length, 0);
      box.append(el("div", { class: "q" }, el("div", { class: "grow" }, el("div", { class: "bold" }, q.title || "Untitled quiz"),
        el("div", { class: "small muted" }, `${n} question${n === 1 ? "" : "s"}`)), send));
    }
  };
  if (myQuizList) fill(myQuizList);
  else import("./library.js").then(({ Quizzes }) => Quizzes.all()).then((list) => {
    myQuizList = list.sort((a, b) => b.updated - a.updated);
    fill(myQuizList);
  }).catch(() => fill([]));
  return section("mine", true, el("summary", {}, "My quizzes on this phone"), box);
}

function moreCard(s) {
  return el("div", { class: "card" }, section("more", false,
    el("summary", {}, "More options"),
    el("div", { class: "btnrow" },
      s.quiz.title ? el("button", { class: "danger", onclick: () => { if (confirm("Go back to the start? Everyone stays joined but scores are reset to 0.")) conn.send({ t: "restart" }); } }, "↺ Restart quiz") : null,
      s.addresses > 1 ? el("button", { class: "ghost", onclick: () => conn.send({ t: "next_address" }) }, "Phones can't connect? Try another address") : null,
      s.online ? null : el("a", { class: "button ghost", href: "/tv", target: "_blank" }, "📺 Open the TV screen in a browser (for AirPlay / casting)"),
      el("button", { class: s.phone_media ? "go" : "ghost", onclick: () => conn.send({ t: "phone_media", on: !s.phone_media }) },
        s.phone_media ? "🔊 Music & videos play on phones too: ON" : "🔈 Also play music & videos on phones: OFF"),
      s.quiz.title && ["idle", "lobby", "final"].includes(s.phase) ? el("button", { class: "danger", onclick: () => {
        if (confirm(`Delete "${s.quiz.title}" from this TV? (Your own copy of the file isn't affected.)`)) conn.send({ t: "delete_quiz", id: s.quiz.id });
      } }, "🗑 Delete this quiz from the TV") : null),
    el("p", { class: "small muted" }, "Playing music & videos on phones is handy when family are joining from somewhere else."),
    el("p", { class: "small muted" }, s.online ? `Game ${s.code} on the Quizlo website. Tip: on a laptop showing the TV page you can also press Space to move on and R to replay a clip.`
      : `Quizlo ${s.version}. Tip: on a laptop you can also press Space to move on, R to replay a clip and F for full screen.`)));
}

$("#file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  toast("Sending to the TV...");
  try {
    const res = await sendQuizToTv(file);
    toast(res.ok ? `Added "${res.title}"` : res.error);
  } catch (err) {
    toast(CODE ? "Couldn't send it - is the TV page still open?" : "Upload failed - check you're on the same Wi-Fi as the TV.");
  }
});
</script>
</body>
</html>
