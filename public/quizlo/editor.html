<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1150">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiz Writer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Quizlo Quiz Writer</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { padding-bottom: 120px; }
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 48px; }
  .bar .logo { font-size: 1.6rem; }
  .back { background: none; min-height: 44px; padding: 6px 4px; color: var(--gold); font-size: 1.1rem; }
  .title-input { font-size: 1.5rem; font-weight: 600; }
  .qlist { list-style: none; margin: 8px 0 0; padding: 0; }
  .qlist li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .qlist li:last-child { border-bottom: 0; }
  .qlist .open { flex: 1; min-width: 0; background: none; justify-content: flex-start; text-align: left; padding: 12px 4px; font-weight: 400; font-size: 1.05rem; }
  .qlist .num { color: var(--gold); font-weight: 600; min-width: 1.6em; }
  .qlist .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qlist .warn { color: var(--bad); font-size: 0.85rem; white-space: nowrap; }
  .qlist .mv { min-height: 40px; min-width: 40px; padding: 4px; background: none; color: var(--muted); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button { min-height: 64px; font-size: 1rem; line-height: 1.15; padding: 8px; border: 2px solid var(--line); background: transparent; }
  .seg button.on { background: var(--gold); color: #2b1d00; border-color: var(--gold); }
  .optrow { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .optrow .letter { width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; flex: none; }
  .optrow .ok { min-width: 56px; min-height: 52px; padding: 4px; border: 2px solid var(--line); background: transparent; font-size: 1.4rem; }
  .optrow .ok.on { background: var(--good); border-color: var(--good); color: #003015; }
  .optrow .del { min-width: 44px; min-height: 52px; padding: 4px; background: none; color: var(--muted); }
  .pinpick { position: relative; border-radius: 14px; overflow: hidden; cursor: crosshair; }
  .pinpick img { width: 100%; display: block; }
  .pinpick .spot { position: absolute; aspect-ratio: 1; border-radius: 50%; border: 4px dashed var(--good); background: rgba(46,229,157,0.25); pointer-events: none; }
  .tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tf button { min-height: 72px; font-size: 1.3rem; border: 3px solid var(--line); background: transparent; }
  .tf button.on { background: var(--good); border-color: var(--good); color: #003015; }
  .mediabtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mediabtns button { flex-direction: column; min-height: 84px; font-size: 0.95rem; gap: 2px; }
  .mediabtns .ic { font-size: 1.7rem; }
  .preview img, .preview video { width: 100%; max-height: 40vh; object-fit: contain; border-radius: 12px; background: #000; }
  .preview audio { width: 100%; }
  .vtrim video { width: 100%; max-height: 40vh; object-fit: contain; border-radius: 12px; background: #000; }
  input[type=range] { padding: 0; height: 44px; accent-color: var(--gold); border: 0; background: none; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg-deep) 70%, transparent); }
  .dock .inner { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .dock .inner > * { flex: 1; }
  .qcard { cursor: pointer; }
  .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .results button { position: relative; padding: 0; min-height: 0; aspect-ratio: 1; overflow: hidden; border-radius: 12px; background: #000; }
  .results img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .results.videos { grid-template-columns: repeat(2, 1fr); }
  .results.videos button { aspect-ratio: 16 / 10; }
  .results .cap { position: absolute; left: 0; right: 0; top: 0; padding: 4px 8px; font-size: 0.8rem; text-align: left; background: linear-gradient(rgba(0,0,0,0.75), transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results .tag { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,0.6); border-radius: 8px; padding: 0 8px; font-size: 0.9rem; }
  .songs .song { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .songs .song:last-child { border-bottom: 0; }
  .songs img, .songs .noart { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
  .songs .grow { min-width: 0; }
  .songs .grow > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .songs button { min-width: 48px; }
  .progress { height: 14px; border-radius: 7px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--good); transition: width 0.3s; }
  .tip { border-left: 4px solid var(--gold); padding: 8px 12px; background: rgba(255, 210, 63, 0.08); border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><div class="logo">Quizlo</div><div class="spinner"></div></div></div>
<div class="dock hidden" id="dock"><div class="inner" id="dock-inner"></div></div>
<input type="file" id="pick" class="hidden">
<script type="module" src="editor.js"></script>
</body>
</html>
