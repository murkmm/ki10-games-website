<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0830">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quizlo TV</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #0e0830; }
  body { font-size: 36px; }
  body::before, body::after { display: none; }
  #bg { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(160deg, #1d1257 0%, #0e0830 75%); }
  #bg i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; opacity: 0.55; will-change: transform; }
  #bg i:nth-child(1) { background: radial-gradient(circle, rgba(255,61,139,0.55), transparent 62%); left: -20vmax; top: -25vmax; animation: float1 23s ease-in-out infinite alternate; }
  #bg i:nth-child(2) { background: radial-gradient(circle, rgba(47,216,240,0.38), transparent 62%); right: -25vmax; top: -10vmax; animation: float2 29s ease-in-out infinite alternate; }
  #bg i:nth-child(3) { background: radial-gradient(circle, rgba(139,92,246,0.7), transparent 62%); left: 10vmax; bottom: -40vmax; animation: float3 31s ease-in-out infinite alternate; }
  #bg i:nth-child(4) { background: radial-gradient(circle, rgba(255,210,63,0.25), transparent 60%); right: -10vmax; bottom: -30vmax; width: 50vmax; height: 50vmax; animation: float1 37s ease-in-out infinite alternate-reverse; }
  @keyframes float1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
  @keyframes float2 { to { transform: translate(-16vmax, 20vmax) scale(0.9); } }
  @keyframes float3 { to { transform: translate(22vmax, -12vmax) scale(1.1); } }
  canvas.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* Everything is laid out on a 1920x1080 stage which is scaled to fit the screen. */
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 24px; padding: 24px 48px 0; min-height: 120px; }
  header .logo { font-size: 56px; }
  header .info { flex: 1; text-align: center; color: rgba(255,255,255,0.7); font-size: 34px; font-weight: 600; }
  header .join { text-align: right; color: rgba(255,255,255,0.7); font-size: 26px; font-weight: 600; line-height: 1.2; }
  main { flex: 1; padding: 12px 64px 40px; display: flex; flex-direction: column; min-height: 0; }
  .qr { background: #fff; display: block; border-radius: 14px; }
  .center { text-align: center; }
  .col { display: flex; flex-direction: column; gap: 22px; flex: 1; min-height: 0; justify-content: center; }
  .h-huge { font-size: 170px; font-weight: 600; line-height: 1; }
  .grad { background: var(--logo); -webkit-background-clip: text; background-clip: text; color: transparent; display: table; margin-left: auto; margin-right: auto; }
  .gold { color: var(--gold); }
  .dim { color: rgba(255,255,255,0.7); }
  .panel { background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.12); border-radius: 36px; padding: 36px; box-shadow: 0 20px 60px rgba(5,2,25,0.35); }
  .chips { display: flex; flex-wrap: wrap; gap: 18px; align-content: flex-start; }
  .chip { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.09); border: 2px solid rgba(255,255,255,0.1); border-radius: 44px; padding: 8px 28px 8px 10px; font-size: 40px; font-weight: 600; }
  .chip.new { animation: chipin 0.55s cubic-bezier(0.3, 1.8, 0.5, 1) both; }
  @keyframes chipin { from { transform: scale(0.3) rotate(-8deg); opacity: 0; } }
  .ball { width: 60px; height: 60px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; flex: none; font-size: 32px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.22); }
  .ball.off { background: rgba(255,255,255,0.1) !important; box-shadow: none; color: rgba(255,255,255,0.5); }
  .ball.new { animation: pop 0.45s cubic-bezier(0.3, 1.8, 0.5, 1) both; }
  .qtext { font-size: 64px; font-weight: 600; text-align: center; line-height: 1.2; animation: qin 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; text-shadow: 0 4px 0 rgba(0,0,0,0.2); }
  @keyframes qin { from { transform: translateY(-30px) scale(0.92); opacity: 0; } }
  .media { flex: 1; min-height: 200px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; animation: fadein 0.5s 0.15s both; }
  .media img, .media video { max-width: 100%; max-height: 100%; min-height: 0; flex: 1; object-fit: contain; border-radius: 24px; }
  .media img { box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
  .credit { font-size: 20px; color: rgba(255,255,255,0.65); }
  .note { font-size: 170px; line-height: 1; animation: beat 0.9s ease-in-out infinite; }
  .eq { display: flex; gap: 14px; align-items: flex-end; height: 120px; }
  .eq b { width: 26px; border-radius: 13px; background: var(--logo); animation: eq 0.9s ease-in-out infinite alternate; }
  .eq b:nth-child(2) { animation-duration: 0.6s; } .eq b:nth-child(3) { animation-duration: 1.1s; } .eq b:nth-child(4) { animation-duration: 0.75s; } .eq b:nth-child(5) { animation-duration: 0.95s; }
  @keyframes eq { from { height: 20%; } to { height: 100%; } }
  @keyframes beat { 50% { transform: scale(1.12) rotate(-6deg); } }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
  .opts.three { grid-template-columns: 1fr 1fr 1fr; }
  .opt { display: flex; align-items: center; gap: 22px; border-radius: 26px; padding: 0 30px 8px 22px; min-height: 104px; font-size: 46px; font-weight: 600; border: 6px solid transparent;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,0.2), 0 14px 30px rgba(0,0,0,0.25); animation: optin 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; transition: transform 0.4s, filter 0.4s, opacity 0.4s; }
  @keyframes optin { from { transform: translateY(40px) scale(0.85); opacity: 0; } }
  .opts.tall .opt { min-height: 150px; }
  .opt .letter { width: 70px; height: 70px; border-radius: 50%; background: rgba(0,0,0,0.2); display: inline-flex; align-items: center; justify-content: center; color: #fff; flex: none; font-size: 38px; }
  .opt .txt { flex: 1; }
  .opt .count { min-width: 60px; text-align: right; }
  .opt.dim { filter: grayscale(0.7) brightness(0.5); transform: scale(0.96); animation: none; }
  .opt.dim .txt { opacity: 0.7; }
  .opt.right { border-color: #fff; animation: right 0.9s cubic-bezier(0.3, 1.6, 0.5, 1) both; box-shadow: inset 0 -10px 0 rgba(0,0,0,0.2), 0 0 0 8px rgba(255,255,255,0.18), 0 0 60px rgba(255,255,255,0.35); }
  @keyframes right { 0% { transform: scale(1); } 35% { transform: scale(1.07) rotate(-1deg); } 100% { transform: scale(1.03); } }
  .footer { display: flex; align-items: center; gap: 20px; min-height: 60px; font-size: 34px; font-weight: 600; }
  .footer .balls { display: flex; gap: 10px; flex-wrap: wrap; }
  .footer .balls .ball { width: 48px; height: 48px; font-size: 26px; }
  .timer { display: flex; align-items: center; gap: 20px; font-size: 40px; font-weight: 600; }
  .track { flex: 1; height: 30px; border-radius: 15px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .track div { height: 100%; width: 100%; border-radius: 15px; }
  .secs { min-width: 190px; text-align: center; font-size: 52px; }
  .secs.hurry { color: var(--bad); animation: pop 0.45s ease-out; }
  .answerbox { background: linear-gradient(160deg, #2ee59d, #12a36b); border-radius: 36px; padding: 30px; text-align: center; min-width: 620px; display: flex; flex-direction: column; justify-content: center; color: #00301a; box-shadow: 0 0 80px rgba(46,229,157,0.35); animation: pop 0.6s both; }
  .rows { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 18px; font-size: 42px; font-weight: 600; animation: rowin 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
  @keyframes rowin { from { transform: translateX(-60px); opacity: 0; } }
  .row .rank { width: 90px; text-align: right; }
  .row .nm { width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .bar { flex: 1; height: 48px; }
  .row .bar div { height: 100%; width: 1%; border-radius: 24px; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.2); transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .row .sc { width: 110px; text-align: right; color: var(--gold); }
  .slam { animation: slam 0.7s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
  @keyframes slam { from { transform: scale(2.4); opacity: 0; } }
  #start { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; background: rgba(14,8,48,0.9); cursor: pointer; text-align: center; padding: 16px; }
  #start .logo { font-size: 84px; }
  #start button { font-size: 1.4rem; }
  .tools { display: flex; gap: 14px; justify-content: center; font-size: 20px; opacity: 0.8; }
  .tools button { font-size: 22px; min-height: 48px; }
  #status { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5; background: linear-gradient(90deg, #ff3d8b, #ff6b4a); padding: 8px 18px; border-radius: 12px; font-size: 18px; font-weight: 600; }
  .fade { animation: fadein 0.35s ease-out both; }
  @keyframes fadein { from { opacity: 0; } }
  .grow-in { animation: growin 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
  @keyframes growin { from { transform: scale(0.5); opacity: 0; } }
</style>
</head>
<body>
<div id="bg"><i></i><i></i><i></i><i></i></div>
<canvas id="sparkles" class="fx"></canvas>
<div id="stage"><header><div class="logo">Quizlo</div><div class="info" id="info"></div><div class="join" id="join"></div><div id="joinqr"></div></header><main id="main"></main></div>
<canvas id="confetti" class="fx"></canvas>
<div id="status" class="hidden">Connecting to Quizlo...</div>
<div id="start">
  <div class="logo">Quizlo TV</div>
  <p style="max-width:560px">This page shows the quiz on a big screen. AirPlay or cast it to the TV, or open it in the TV's own web browser.</p>
  <button class="primary big" style="max-width:420px">▶ Start the TV screen</button>
  <p class="small muted" style="max-width:560px">(Tapping lets the music, videos and sound effects play. Tip: on an iPad or iPhone, use Screen Mirroring to AirPlay it.)</p>
</div>
<audio id="audio" preload="auto"></audio>
<video id="video" playsinline preload="auto" class="hidden"></video>
<button id="tapsound" class="primary big hidden" style="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:8;max-width:520px">🔈 Tap to play the sound</button>
<input type="file" id="open-quiz" accept=".quizlo,.quizzy,application/zip,application/octet-stream" class="hidden">

<script type="module">
import { Connection, $, el, keepAwake, LETTERS, ordinal, formatNumber, servedByApp, toast } from "./connection.js";

const COLORS = ["#ff4d6d", "#3b82f6", "#ffb020", "#1fc77a", "#a855f7", "#f97316"];
const TEXT = ["#fff", "#fff", "#2b1600", "#002a14", "#fff", "#fff"];
const audio = $("#audio");
// One video player, re-used for every question: iPads and iPhones only let a video play with sound
// if that player was started by a tap, so it's "unlocked" by the Start button.
const videoEl = $("#video");
const SILENT_MP4 = "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAWwbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAAMgAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwAAAll0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAAMgAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAABAAAAAQAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAADIAAAAAAABAAAAAAHRbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAAAoAAAACABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABfG1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAATxzdGJsAAAAuHN0c2QAAAAAAAAAAQAAAKhhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAABAAEABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAALmF2Y0MBQsAK/+EAFmdCwArZHsBEAAADAAQAAAMAUDxImSABAAVoy4PLIAAAABBwYXNwAAAAAQAAAAEAAAAUYnRydAAAAAAAAGXgAABl4AAAABhzdHRzAAAAAAAAAAEAAAACAAAEAAAAABRzdHNzAAAAAAAAAAEAAAABAAAAHHN0c2MAAAAAAAAAAQAAAAEAAAABAAAAAQAAABxzdHN6AAAAAAAAAAAAAAACAAACgwAAAAkAAAAYc3RjbwAAAAAAAAACAAAF9QAACIwAAAKBdHJhawAAAFx0a2hkAAAAAwAAAAAAAAAAAAAAAgAAAAAAAADIAAAAAAAAAAAAAAABAQAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAJGVkdHMAAAAcZWxzdAAAAAAAAAABAAAAyAAABAAAAQAAAAAB+W1kaWEAAAAgbWRoZAAAAAAAAAAAAAAAAAAArEQAACZ0VcQAAAAAAC1oZGxyAAAAAAAAAABzb3VuAAAAAAAAAAAAAAAAU291bmRIYW5kbGVyAAAAAaRtaW5mAAAAEHNtaGQAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAWhzdGJsAAAAfnN0c2QAAAAAAAAAAQAAAG5tcDRhAAAAAAAAAAEAAAAAAAAAAAABABAAAAAArEQAAAAAADZlc2RzAAAAAAOAgIAlAAIABICAgBdAFQAAAAAAfQAAAAf6BYCAgAUSCFblAAaAgIABAgAAABRidHJ0AAAAAAAAfQAAAAf6AAAAIHN0dHMAAAAAAAAAAgAAAAkAAAQAAAAAAQAAAnQAAAA0c3RzYwAAAAAAAAADAAAAAQAAAAEAAAABAAAAAgAAAAUAAAABAAAAAwAAAAQAAAABAAAAPHN0c3oAAAAAAAAAAAAAAAoAAAAVAAAABAAAAAQAAAAEAAAABAAAAAQAAAAEAAAABAAAAAQAAAAEAAAAHHN0Y28AAAAAAAAAAwAABeAAAAh4AAAIlQAAABpzZ3BkAQAAAHJvbGwAAAACAAAAAf//AAAAHHNiZ3AAAAAAcm9sbAAAAAEAAAAKAAAAAQAAAGJ1ZHRhAAAAWm1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAALWlsc3QAAAAlqXRvbwAAAB1kYXRhAAAAAQAAAABMYXZmNjAuMTYuMTAwAAAACGZyZWUAAALNbWRhdN4CAExhdmM2MC4zMS4xMDIAAjBADgAAAnEGBf//bdxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjQgcjMxMDggMzFlMTlmOSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjMgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0wIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDE6MHgxMTEgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTAgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MCB3ZWlnaHRwPTAga2V5aW50PTI1MCBrZXlpbnRfbWluPTEwIHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9NDAgcmM9Y3JmIG1idHJlZT0xIGNyZj0yMy4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcHN0ZXA9NCBpcF9yYXRpbz0xLjQwIGFxPTE6MS4wMACAAAAACmWIhA7yYoAAvv4BGCAHARggBwEYIAcBGCAHARggBwAAAAVBmjgb6gEYIAcBGCAHARggBwEYIAc=";
let state = null, screenKey = "", timerEnd = 0, timerTotal = 0, started = false, video = null;

// --- Fit the 1920x1080 stage to the window --------------------------------------------------
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("#stage").style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener("resize", fit); fit();

// --- Connection -----------------------------------------------------------------------------
// With the Quizlo app: the app runs the game and this page just draws it.
// On the website (no app): this page runs the whole game itself and phones connect to it.
let online = null;
const setStatus = (ok, message) => {
  $("#status").textContent = message || "Connecting...";
  $("#status").classList.toggle("hidden", ok);
};
servedByApp().then(async (app) => {
  if (app) {
    const conn = new Connection({
      onOpen: () => conn.send({ t: "hello", role: "tv" }),
      onStatus: (ok) => setStatus(ok, "Connecting to Quizlo..."),
      onMessage: (m) => {
        if (m.t === "state") { state = m; render(); }
        else if (m.t === "media") media(m.cmd);
      },
    });
    return;
  }
  const { startOnlineTv } = await import("./tvhost.js");
  online = await startOnlineTv({
    onState: (s) => { state = s; render(); },
    onMedia: (cmd) => media(cmd),
    onStatus: (ok, message) => setStatus(ok, message || "Connecting to the internet..."),
  });
});

// Keyboard (e.g. a laptop on HDMI) when this page runs the game itself.
addEventListener("keydown", (e) => {
  if (!online || e.target.closest("input, button")) return;
  if ([" ", "Enter", "ArrowRight"].includes(e.key)) { e.preventDefault(); online.engine.game.advance(); }
  if (e.key === "r" || e.key === "R") online.engine.game.onMedia("replay");
});
$("#open-quiz").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file || !online) return;
  const res = await online.openFile(file);
  toast(res.ok ? `Opened "${res.title}"` : res.error);
});

$("#start").onclick = async () => {
  started = true;
  $("#start").classList.add("hidden");
  sfx.start();
  try { audio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="; await audio.play(); } catch (_) {}
  try { videoEl.src = SILENT_MP4; videoEl.muted = false; await videoEl.play(); } catch (_) {}
  keepAwake();
  try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (_) {}
  screenKey = "";
  if (state) render();
};

// --- Sound effects ----------------------------------------------------------------------------
// Played through Web Audio (so iPads/iPhones let them overlap with the quiz's own music).
const sfx = {
  ctx: null, gain: null, buffers: {}, volume: 0.7,
  start() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!this.ctx) {
        this.ctx = new AC();
        this.gain = this.ctx.createGain();
        this.gain.gain.value = this.volume;
        this.gain.connect(this.ctx.destination);
        for (const n of ["join", "answer", "question", "round", "tick", "timeup", "reveal", "scores", "drumroll", "fanfare"]) {
          fetch(`sfx/${n}.wav`).then((r) => r.arrayBuffer()).then((b) => new Promise((ok, bad) => this.ctx.decodeAudioData(b, ok, bad)))
            .then((buf) => { this.buffers[n] = buf; }).catch(() => {});
        }
      }
      this.ctx.resume();
    } catch (_) {}
  },
  setVolume(v) {
    this.volume = v;
    if (this.gain) this.gain.gain.value = v;
  },
  play(name, gain = 1) {
    const buf = this.buffers[name];
    if (!this.ctx || !buf || this.volume <= 0) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    let out = this.gain;
    if (gain !== 1) { out = this.ctx.createGain(); out.gain.value = gain; out.connect(this.gain); }
    src.connect(out);
    src.start();
  },
};
let heard = null; // what the last state sounded like, to play effects when things change
function sounds(s) {
  const q = s.question || {};
  const now = { phase: s.phase, key: q.key, answered: q.answered || 0, open: q.open, players: s.players.length };
  const was = heard;
  heard = now;
  if (!was || !started) return;
  if (now.phase !== was.phase || now.key !== was.key) {
    if (now.phase === "round_intro") sfx.play("round");
    else if (now.phase === "question") sfx.play("question", q.audio || q.video ? 0.5 : 1);
    else if (now.phase === "reveal") sfx.play("reveal");
    else if (now.phase === "scores") sfx.play("scores");
    else if (now.phase === "final") sfx.play("drumroll");
    return;
  }
  if (now.phase === "lobby" && now.players > was.players) sfx.play("join");
  if (now.phase === "question") {
    if (now.answered > was.answered) sfx.play("answer");
    if (was.open && !now.open) sfx.play("timeup");
  }
}

function media(cmd) {
  const q = state && state.question;
  if (cmd === "stop") { audio.pause(); videoEl.pause(); $("#tapsound").classList.add("hidden"); }
  if (cmd === "replay" && q) {
    if (q.audio) { audio.currentTime = 0; playWithSound(audio); }
    if (video) { video.muted = false; video.currentTime = 0; playWithSound(video); }
  }
}

/** Plays with sound; if the browser blocks that, plays silently and offers a "tap for sound" button. */
function playWithSound(m) {
  m.muted = false;
  m.play().then(() => $("#tapsound").classList.add("hidden")).catch(() => {
    if (m.tagName === "VIDEO") { m.muted = true; m.play().catch(() => {}); }
    const b = $("#tapsound");
    b.classList.remove("hidden");
    b.onclick = () => { b.classList.add("hidden"); m.muted = false; m.play().catch(() => {}); };
  });
}
let timerKey = "";

// --- Drawing --------------------------------------------------------------------------------
function qrSvg(rows, px) {
  if (!rows || !rows.length) return el("div");
  const n = rows.length, border = 3, size = n + border * 2;
  let d = "";
  rows.forEach((row, y) => { for (let x = 0; x < n; x++) if (row[x] === "1") d += `M${x + border} ${y + border}h1v1h-1z`; });
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
  svg.setAttribute("width", px); svg.setAttribute("height", px);
  svg.setAttribute("shape-rendering", "crispEdges");
  svg.classList.add("qr");
  svg.innerHTML = `<path d="${d}" fill="#000"/>`;
  return svg;
}
const ball = (p, size, off) => el("span", { class: "ball" + (off ? " off" : ""), style: `background:#${p.color}` + (size ? `;width:${size}px;height:${size}px;font-size:${Math.round(size * 0.55)}px` : "") }, p.name.slice(0, 1).toUpperCase());
const short = (url) => url.replace("http://", "").replace(/\/$/, "");
const joinWhere = (s) => s.online ? `${s.join_text}  ·  code ${s.code}` : short(s.join_url);

function render() {
  const s = state;
  if (s.volume) {
    audio.volume = videoEl.volume = Math.max(0, Math.min(1, s.volume.media / 100));
    sfx.setVolume(Math.max(0, Math.min(1, s.volume.sfx / 100)));
  }
  sounds(s);
  const key = [s.phase, s.quiz_title, s.question?.key, s.join_url, started].join("|");
  // Header
  const inGame = !["idle", "lobby"].includes(s.phase);
  $("#info").textContent = s.question?.key ? `${s.round.title}  ·  Question ${s.question.number} of ${s.question.total}` : (inGame ? s.quiz_title : "");
  $("#join").replaceChildren(...(inGame ? ["Join late?", el("br"), joinWhere(s)] : []));
  $("#joinqr").replaceChildren(inGame ? qrSvg(s.join_qr, 96) : el("div"));
  $(".logo").style.visibility = s.phase === "idle" ? "hidden" : "visible";
  if (key !== screenKey) {
    screenKey = key;
    // Park the shared video player (and stop it) before the screen is rebuilt.
    videoEl.pause(); videoEl.classList.add("hidden"); document.body.append(videoEl);
    $("#tapsound").classList.add("hidden");
    const content = { idle, lobby, round_intro: roundIntro, question, reveal: question, scores, final: scores }[s.phase](s);
    content.classList.add("fade");
    $("#main").replaceChildren(content);
  }
  update(s);
}

function idle(s) {
  return el("div", { class: "col center" },
    el("div", { class: "h-huge grad grow-in" }, "Quizlo"),
    el("div", { style: "font-size:48px" }, "Questions on the TV, answers on your phone"),
    s.server_error ? el("div", { style: "color:#ff8a80" }, s.server_error) :
    el("div", { style: "display:flex;gap:48px;align-items:center;justify-content:center;margin-top:20px" },
      qrSvg(s.host_qr, 320),
      el("div", { style: "text-align:left" },
        el("div", { class: "gold", style: "font-size:52px;font-weight:600" }, "Quiz master:"),
        el("div", { style: "font-size:40px" }, "Scan this with your phone camera", el("br"), "to choose a quiz and run the show."),
        el("div", { class: "dim", style: "font-size:30px;margin-top:12px" }, s.online ? `Game code: ${s.code}` : "Or type:  " + short(s.host_url)))),
    s.online ? onlineTools() : null);
}

/** Buttons for when this page runs the game (only shown before the quiz starts). */
function onlineTools() {
  return el("div", { class: "tools" },
    el("button", { class: "ghost small", onclick: () => $("#open-quiz").click() }, "📂 Open a quiz file"),
    el("button", { class: "ghost small", onclick: () => { if (confirm("Get a new game code? Everyone will need to join again.")) online.newGameCode(); } }, "🔄 New game code"));
}

function lobby(s) {
  return el("div", { style: "display:flex;gap:56px;flex:1;min-height:0" },
    el("div", { class: "panel center", style: "width:640px;display:flex;flex-direction:column;justify-content:center;gap:14px;align-items:center" },
      el("div", { class: "gold", style: "font-size:64px;font-weight:600" }, "Join the quiz!"),
      el("div", { style: "font-size:32px" }, "Point your phone camera here"),
      qrSvg(s.join_qr, 420),
      ...(s.online ? [
        el("div", { class: "dim", style: "font-size:26px" }, `or go to ${s.join_text} and enter the code`),
        el("div", { class: "grad", style: "font-size:104px;font-weight:600;letter-spacing:12px;line-height:1" }, s.code),
      ] : [
        el("div", { class: "dim", style: "font-size:26px" }, "or type into your web browser:"),
        el("div", { style: "font-size:44px;font-weight:600" }, short(s.join_url)),
      ])),
    el("div", { style: "flex:1;display:flex;flex-direction:column;gap:20px;min-width:0" },
      el("div", { style: "font-size:72px;font-weight:600" }, s.quiz_title),
      el("div", { class: "gold", style: "font-size:40px;font-weight:600", id: "count" }),
      el("div", { class: "chips", id: "chips", style: "flex:1" }),
      el("div", { style: "display:flex;align-items:flex-end;gap:20px" },
        el("div", { class: "dim", id: "hint", style: "flex:1;font-size:34px;font-weight:600" }),
        el("div", { class: "center" }, qrSvg(s.host_qr, 130), el("div", { class: "dim", style: "font-size:20px" }, "Quiz master"))),
      s.online ? onlineTools() : null));
}

function roundIntro(s) {
  return el("div", { class: "col center" },
    el("div", { class: "gold slam", style: "font-size:64px;font-weight:600;letter-spacing:6px;text-transform:uppercase" }, `Round ${s.round.number} of ${s.round.of}`),
    el("div", { class: "grow-in", style: "font-size:130px;font-weight:600;line-height:1.1;animation-delay:0.35s" }, s.round.title),
    el("div", { class: "dim", style: "font-size:40px" }, s.round.questions === 1 ? "1 question" : `${s.round.questions} questions`));
}

function question(s) {
  const q = s.question, reveal = s.phase === "reveal";
  const box = el("div", { class: "col", style: "justify-content:" + (q.media ? "flex-start" : "center") });
  if (q.text) box.append(el("div", { class: "qtext", style: `font-size:${(q.text.length < 60 ? 64 : q.text.length < 120 ? 52 : 42) + (q.media ? 0 : 8)}px` }, q.text));
  video = null;
  if (q.media) {
    const m = el("div", { class: "media" });
    if (q.image) m.append(el("img", { src: q.image, alt: "" }));
    if (q.audio) {
      m.append(reveal ? el("div", { class: "note" }, "🎵") : el("div", { class: "eq" }, el("b"), el("b"), el("b"), el("b"), el("b")),
        el("div", { style: "font-size:40px;margin-top:16px" }, reveal ? "" : "Listen carefully..."));
      if (!reveal) { audio.src = q.audio; audio.currentTime = 0; playWithSound(audio); }
    }
    if (q.video) {
      video = videoEl;
      video.classList.remove("hidden");
      if (video.dataset.src !== q.video) { video.src = q.video; video.dataset.src = q.video; }
      video.currentTime = 0;
      m.append(video);
      if (reveal) { video.muted = true; video.play().catch(() => {}); }
      else { video.muted = false; playWithSound(video); }
    }
    if (reveal && q.credit) m.append(el("div", { class: "credit" }, q.credit));
    box.append(m);
  }
  if (q.type === "choice") {
    const grid = el("div", { class: "opts" + (q.options.length > 4 ? " three" : "") + (q.media ? "" : " tall") });
    q.options.forEach((t, i) => {
      const right = reveal && i === q.answer;
      grid.append(el("div", { class: "opt" + (reveal ? (right ? " right" : " dim") : ""), style: `background:${COLORS[i]};color:${TEXT[i]}` + (reveal ? "" : `;animation-delay:${0.25 + i * 0.09}s`) },
        el("span", { class: "letter" }, LETTERS[i]), el("span", { class: "txt", style: t.length < 28 ? "" : "font-size:36px" }, t),
        reveal && right ? el("span", { style: "font-size:56px" }, "✓") : null,
        reveal ? el("span", { class: "count" }, String(q.counts[i] || 0)) : null));
    });
    box.append(grid);
  } else if (!reveal) {
    box.append(el("div", { class: "panel center" },
      el("div", { class: "gold", style: "font-size:54px;font-weight:600" }, "Closest guess wins!"),
      el("div", { style: "font-size:38px" }, "Type your best guess on your phone" + (q.unit ? `  (in ${q.unit})` : ""))));
  } else {
    const list = el("div", { class: "rows", style: "flex:1" });
    if (!q.guesses.length) list.append(el("div", { class: "dim", style: "font-size:44px" }, "Nobody guessed!"));
    q.guesses.slice(0, 6).forEach((g, i) => list.append(el("div", { class: "row", style: `animation-delay:${0.3 + i * 0.12}s` }, ball(g, 52),
      el("span", { style: `flex:1;color:${g.won ? "var(--gold)" : "#fff8e7"}` }, g.name),
      el("span", { style: `color:${g.won ? "var(--gold)" : "#fff8e7"}` }, formatNumber(g.guess) + (q.unit ? " " + q.unit : "") + (g.won ? " ★" : "")))));
    box.append(el("div", { style: "display:flex;gap:40px" },
      el("div", { class: "answerbox" }, el("div", { style: "font-size:40px" }, "The answer is"), el("div", { style: "font-size:96px;font-weight:600;line-height:1.1" }, q.answer_text)),
      list));
  }
  if (q.time > 0 && !reveal) {
    timerTotal = q.time * 1000;
    timerEnd = performance.now() + q.time_left_ms;
    timerKey = q.key;
    box.append(el("div", { class: "timer" }, "⏱", el("div", { class: "track" }, el("div", { id: "tfill" })), el("span", { id: "tlabel", class: "secs" })));
  } else timerTotal = 0;
  box.append(el("div", { class: "footer", id: "footer" }));
  return box;
}

function scores(s) {
  const final = s.phase === "final";
  const board = s.leaderboard || [];
  const top = Math.max(1, ...board.map((e) => e.score));
  const box = el("div", { class: "col" },
    el("div", { class: "gold center slam", style: "font-size:72px;font-weight:600" }, final ? "And the winner is..." : `Scores after round ${s.round.number}`));
  if (final && board.length) {
    const w = el("div", { class: "center grad", style: "font-size:130px;font-weight:600;line-height:1.1;visibility:hidden" }, board.filter((e) => e.rank === 1).map((e) => e.name).join(" & ") + "!");
    box.append(w);
    setTimeout(() => { if (!w.isConnected) return; w.style.visibility = "visible"; w.classList.add("grow-in"); confetti(); sfx.play("fanfare"); }, 2200);
  }
  const rows = el("div", { class: "rows" });
  board.slice(0, final ? 8 : 10).forEach((e, i) => {
    const delay = 150 * i + (final ? 2600 : 250);
    const fill = el("div", { style: `background:#${e.color}` });
    const sc = el("span", { class: "sc" }, "0");
    rows.append(el("div", { class: "row", style: `animation-delay:${delay / 1000 - 0.2}s` },
      el("span", { class: "rank", style: e.rank === 1 ? "color:var(--gold)" : "" }, ordinal(e.rank)), ball(e, 56),
      el("span", { class: "nm" }, e.name), el("span", { class: "bar" }, fill), sc));
    setTimeout(() => {
      fill.style.width = `${Math.max(1, (Math.max(0, e.score) / top) * 100)}%`;
      countUp(sc, e.score, 900);
    }, delay);
  });
  if (!board.length) rows.append(el("div", { class: "dim" }, "Nobody played!"));
  box.append(rows);
  return box;
}

/** Counts a number up on screen. */
function countUp(node, to, ms) {
  const t0 = performance.now();
  (function step(now) {
    const f = Math.min(1, (now - t0) / ms);
    node.textContent = Math.round(to * (1 - Math.pow(1 - f, 3)));
    if (f < 1 && node.isConnected) requestAnimationFrame(step);
  })(t0);
}

let seenChips = new Set(), seenAnswers = new Set();
function update(s) {
  if (s.phase === "lobby") {
    const n = s.players.length;
    $("#count").textContent = n === 0 ? "Nobody here yet..." : n === 1 ? "1 player ready" : `${n} players ready`;
    $("#hint").textContent = n === 0 ? "Everyone: scan the code to join in!" : "Waiting for the quiz master to start...";
    $("#chips").replaceChildren(...s.players.map((p) => el("div", { class: "chip" + (seenChips.has(p.id) ? "" : " new"), style: p.online ? "" : "opacity:0.6" }, ball(p), p.name)));
    seenChips = new Set(s.players.map((p) => p.id));
  }
  const footer = $("#footer");
  if (!footer || !s.question) return;
  const q = s.question;
  // Answers re-opened with extra time: move the countdown on.
  if (timerTotal && q.key === timerKey && q.open && q.time_left_ms > 0) timerEnd = performance.now() + q.time_left_ms;
  if (s.phase === "question") {
    const text = q.everyone ? "Everyone has answered!" : !q.open ? "Answers are locked!" : `${q.answered} of ${s.players.length} answered`;
    footer.replaceChildren(el("span", { style: q.everyone ? "color:var(--gold)" : "" }, text),
      el("span", { class: "balls" }, s.players.map((p) => {
        const b = ball(p, 0, !p.answered);
        const id = q.key + p.id;
        if (p.answered && !seenAnswers.has(id)) { b.classList.add("new"); seenAnswers.add(id); }
        return b;
      })));
  } else if (q.type === "choice") {
    const winners = s.players.filter((p) => p.won).map((p) => p.name);
    const text = !winners.length ? "Nobody got it this time!" : (winners.length === s.players.length && winners.length > 1) ? "Everybody got it right!" : "Well done: " + winners.join(", ");
    footer.replaceChildren(el("span", { class: "gold", style: "flex:1;text-align:center" }, text));
  } else footer.replaceChildren();
}

// Countdown bar (ticks for the last 5 seconds)
let lastSecond = -1;
(function tick() {
  if (timerTotal && $("#tfill")) {
    const left = Math.max(0, timerEnd - performance.now());
    const f = left / timerTotal;
    const secs = Math.ceil(left / 1000);
    $("#tfill").style.width = `${f * 100}%`;
    $("#tfill").style.background = `linear-gradient(90deg, hsl(${Math.round(f * 140)}, 85%, 55%), hsl(${Math.round(f * 140) + 20}, 90%, 62%))`;
    if (secs !== lastSecond) {
      lastSecond = secs;
      const label = $("#tlabel");
      label.textContent = left > 0 ? secs : "Time's up!";
      label.classList.remove("hurry");
      if (left > 0 && secs <= 5 && state?.question?.open) { void label.offsetWidth; label.classList.add("hurry"); sfx.play("tick"); }
    }
  }
  requestAnimationFrame(tick);
})();

// --- Floating sparkles and confetti ------------------------------------------------------------
const sparkles = $("#sparkles"), sctx = sparkles.getContext("2d");
const SPARK_COLORS = ["255,61,139", "47,216,240", "255,210,63", "178,107,255", "255,255,255"];
const motes = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 3.5, v: 0.008 + Math.random() * 0.02,
  d: Math.random() * 6, c: SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)], a: 0.15 + Math.random() * 0.35 }));
let confettiBits = [];
const conf = $("#confetti"), cctx = conf.getContext("2d");
function confetti() {
  const colors = [...COLORS, "#ffd23f", "#ffffff", "#2fd8f0"];
  confettiBits = Array.from({ length: 320 }, () => ({ x: 0.5 + (Math.random() - 0.5) * 0.3, y: 0.55, vx: (Math.random() - 0.5) * 0.02, vy: -0.012 - Math.random() * 0.014,
    a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, c: colors[Math.floor(Math.random() * colors.length)], w: 0.6 + Math.random() * 0.8 }));
}
let last = performance.now();
(function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const c of [sparkles, conf]) if (c.width !== innerWidth || c.height !== innerHeight) { c.width = innerWidth; c.height = innerHeight; }
  sctx.clearRect(0, 0, sparkles.width, sparkles.height);
  const k = sparkles.height / 1080;
  for (const m of motes) {
    m.y -= m.v * dt; m.d += dt;
    if (m.y < -0.02) { m.y = 1.02; m.x = Math.random(); }
    const tw = 0.6 + 0.4 * Math.sin(m.d * 2);
    sctx.fillStyle = `rgba(${m.c},${m.a * tw})`;
    sctx.beginPath(); sctx.arc((m.x + Math.sin(m.d * 0.7) * 0.01) * sparkles.width, m.y * sparkles.height, m.r * k * 2, 0, Math.PI * 2); sctx.fill();
  }
  cctx.clearRect(0, 0, conf.width, conf.height);
  const ck = conf.height / 1080;
  for (const b of confettiBits) {
    b.x += b.vx; b.y += b.vy; b.vy += 0.00028; b.vx *= 0.99; b.a += b.va;
    cctx.save(); cctx.translate(b.x * conf.width, b.y * conf.height); cctx.rotate(b.a); cctx.scale(1, Math.cos(b.a * 2)); cctx.fillStyle = b.c;
    cctx.fillRect(-7 * ck * b.w, -11 * ck * b.w, 14 * ck * b.w, 22 * ck * b.w); cctx.restore();
  }
  confettiBits = confettiBits.filter((b) => b.y < 1.1);
  requestAnimationFrame(frame);
})(last);
</script>
</body>
</html>
