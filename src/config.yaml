site:
  name: Ki10 Games
  site: 'https://ki10games.com' # Add your live domain here
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: Ki10 Games
    template: '%s | Ki10 Games'
  description: 'Ki10 Games is a two person independent game studio in the UK. Makers of Skill Check, currently building the party brawler Boop n Burn.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Ki10 Games
    images:
      - url: '~/assets/images/og-ki10-games.png'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '@Ki10Games'
    site: '@Ki10Games'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'devlog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"
    plausible:
      # Cookieless and GDPR friendly, so no cookie banner needed.
      # Sign up at plausible.io, add ki10games.com, then put the domain here.
      domain: null # or "ki10games.com"
      src: 'https://plausible.io/js/script.js'

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
